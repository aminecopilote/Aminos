<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Agent</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f3f3f1;--acc:#c15f3c;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#eee;--mut:#999;--card:#2a2926;--bd:#3a3936}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:var(--fg);display:flex;height:100vh}
aside{width:260px;padding:14px;border-right:1px solid var(--bd);overflow:auto}main{flex:1;display:flex;flex-direction:column;min-width:0}
#log{flex:1;overflow:auto;padding:16px}.m{max-width:820px;margin:0 auto 12px;padding:10px 14px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}
.user{background:var(--card)}.assistant{border:1px solid var(--bd)}.err{color:#c33}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--bd)}textarea{flex:1;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;resize:none}
button,select{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}button.p{background:var(--acc);color:#fff;border:0}
li{list-style:none;display:flex;gap:6px;align-items:center;margin:4px 0;word-break:break-all}.s{color:var(--mut);font-size:12px}
@media(max-width:700px){aside{display:none}}
</style></head><body>
<aside><h3>Atelier Agent</h3><label class="s">Modèle</label><br><select id="prov"></select><p class="s" id="st"></p>
<h4>Fichiers</h4><input type="file" id="up" multiple><ul id="fl" style="padding:0"></ul><p class="s">Coche un fichier pour l'inclure dans la question.</p></aside>
<main><div id="log"></div><form id="f"><textarea id="q" rows="2" placeholder="Pose ta question… (Entrée pour envoyer)"></textarea><button class="p">Envoyer</button></form></main>
<script>
const $=id=>document.getElementById(id);let hist=[];const sel=new Set();
async function status(){const s=await (await fetch('/api/status')).json();
 $('prov').innerHTML=Object.entries(s.providers).map(([k,v])=>`<option value="${k}" ${v.configured?'':'disabled'}>${k} — ${v.model}${v.configured?'':' (clé manquante)'}</option>`).join('');
 const first=Object.entries(s.providers).find(([,v])=>v.configured);if(first)$('prov').value=first[0];
 $('st').textContent=s.skills+' skills chargées'+(first?'':' — ajoute une clé API dans .env');files(s.files)}
function files(l){$('fl').innerHTML='';l.forEach(f=>{const li=document.createElement('li');const c=document.createElement('input');c.type='checkbox';c.checked=sel.has(f.name);c.onchange=()=>c.checked?sel.add(f.name):sel.delete(f.name);
 const d=document.createElement('button');d.textContent='✕';d.type='button';d.onclick=async()=>{sel.delete(f.name);files(await (await fetch('/api/files?name='+encodeURIComponent(f.name),{method:'DELETE'})).json())};
 li.append(c,document.createTextNode(f.name+' '),d);$('fl').append(li)})}
$('up').onchange=async e=>{for(const f of e.target.files){const b=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
 const r=await fetch('/api/files',{method:'POST',body:JSON.stringify({name:f.name,contentBase64:b})});const j=await r.json();if(j.error)add('err',j.error);else{sel.add(f.name);files(j.files)}}e.target.value=''};
function add(c,t){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('log').append(d);$('log').scrollTop=1e9;return d}
$('f').onsubmit=async e=>{e.preventDefault();const t=$('q').value.trim();if(!t)return;$('q').value='';add('user',t);hist.push({role:'user',content:t});const w=add('assistant','…');
 try{const r=await fetch('/api/chat',{method:'POST',body:JSON.stringify({provider:$('prov').value,messages:hist,files:[...sel]})});const j=await r.json();
 if(j.error)throw new Error(j.error);w.textContent=j.answer+(j.skills.length?'\n\n[skills: '+j.skills.join(', ')+']':'');hist.push({role:'assistant',content:j.answer})}
 catch(x){w.className='m err';w.textContent='Erreur: '+x.message;hist.pop()}};
$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('f').requestSubmit()}};
status();
</script></body></html>
