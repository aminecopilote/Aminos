name: EKA Système

on:
  push:
    paths: ['eka-systeme/**', '.github/workflows/eka-systeme.yml']
  pull_request:
    paths: ['eka-systeme/**', '.github/workflows/eka-systeme.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eka-systeme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eka-systeme/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
