name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Core tests only (no optional dependency)
        run: python -m unittest discover -s tests
      - name: Install with notarisation and swarm extras
        run: pip install -e ".[notary,swarm,docx,test]"
      - name: Full tests (notary seals verified independently with openssl)
        run: python -m unittest discover -s tests

  vendor:
    # Third-party repos at pinned commits, run in isolation. Informational: their failures are not ours.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: lab/vendor_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vendor-results, path: lab/results }

  docker:
    # Builds the real deploy/Dockerfile (including the apt layer with Tesseract) and checks the app answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: AMINOS_USER=x AMINOS_PASSWORD_HASH=x docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build image
        run: docker build -f deploy/Dockerfile -t aminos:ci .
      - name: App starts and is healthy; OCR languages and optional extras are present
        run: |
          docker run -d --name aminos -p 8501:8501 aminos:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8501/_stcore/health && break; sleep 2; done
          docker exec aminos tesseract --list-langs | grep -E "ara|fra|eng|nld"
          docker exec aminos python -c "import agent_coordinator, pyhanko, cryptography; print('extras ok')"
          docker exec aminos id -u | grep -qx 10001

  windows-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: deploy/windows/build_bundle.sh
      - uses: actions/upload-artifact@v4
        with: { name: aminos-windows, path: dist/aminos-windows.zip }

  windows:
    # Installs the bundle on a real Windows machine (single-user with a shared password, and multi-user "saas" mode).
    needs: windows-bundle
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [single, saas]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: aminos-windows }
      - name: Install per user (Windows PowerShell 5.1; the runner is not elevated, so no boot task; Caddy over HTTP)
        shell: powershell
        run: |
          Expand-Archive aminos-windows.zip -DestinationPath bundle
          Set-Location bundle\aminos-windows
          $extra = if ("${{ matrix.mode }}" -eq "saas") { @("-Saas") } else { @() }
          .\install.ps1 -Dir C:\Aminos -Domain "http://localhost:8080" -NoService @extra
      - name: App healthy and extras importable
        shell: powershell
        run: |
          $ok = $false
          foreach ($i in 1..60) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8501/_stcore/health -UseBasicParsing).Content -eq "ok") { $ok = $true; break } } catch { }
            Start-Sleep 3
          }
          if (-not $ok) {
            Write-Host "--- logs dir"; Get-ChildItem C:\Aminos\logs -ErrorAction SilentlyContinue | Format-Table Name, Length
            Write-Host "--- app.log"; Get-Content C:\Aminos\logs\app.log -ErrorAction SilentlyContinue
            Write-Host "--- processes"; Get-Process | Where-Object { $_.Name -match "streamlit|python|powershell|caddy" } | Format-Table Id, Name, Path
            Write-Host "--- listeners"; Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 8501, 8080 } | Format-Table LocalAddress, LocalPort, OwningProcess
            throw "app not healthy"
          }
          & C:\Aminos\venv\Scripts\python.exe -c "import aminos, aminos.saas, agent_coordinator, pyhanko, cryptography, docx, streamlit; print('extras ok')"
          if ($LASTEXITCODE -ne 0) { throw "import failed" }
          & C:\Aminos\venv\Scripts\aminos.exe notary init -w C:\nw
          if ($LASTEXITCODE -ne 0) { throw "notary init failed" }
      - name: Single-user mode asks for the shared password
        if: matrix.mode == 'single'
        shell: powershell
        run: |
          try { Invoke-WebRequest http://localhost:8080/ -UseBasicParsing | Out-Null; throw "no password asked" } catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw } }
          $pw = (Get-Content C:\Aminos\FIRST_PASSWORD.txt).Trim()
          $h = @{ Authorization = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("aminos:$pw")) }
          if ((Invoke-WebRequest http://localhost:8080/_stcore/health -Headers $h -UseBasicParsing).Content -ne "ok") { throw "proxy with password failed" }
      - name: Multi-user mode - app reachable, administrator can sign in, wrong password cannot
        if: matrix.mode == 'saas'
        shell: powershell
        run: |
          if ((Invoke-WebRequest http://localhost:8080/_stcore/health -UseBasicParsing).Content -ne "ok") { throw "not reachable through Caddy" }
          if (-not (Test-Path C:\Aminos\saas.env)) { throw "saas.env missing" }
          $pw = (Get-Content C:\Aminos\FIRST_PASSWORD.txt).Trim()
          $code = @'
          import sys
          from aminos.saas import AuthError, SaaSStore
          s = SaaSStore(r"C:\Aminos\data\saas")
          s.bootstrap_admin("admin", sys.argv[1])
          assert s.authenticate("admin", sys.argv[1]).is_admin
          try:
              s.authenticate("admin", "wrong-password-xx"); raise SystemExit("wrong password accepted")
          except AuthError:
              print("saas auth ok on Windows")
          '@
          Set-Content -Path C:\check_saas.py -Value $code
          & C:\Aminos\venv\Scripts\python.exe C:\check_saas.py $pw
          if ($LASTEXITCODE -ne 0) { throw "saas check failed" }
      - name: Uninstall removes files and processes, keeps data
        shell: powershell
        run: |
          C:\Aminos\uninstall.ps1 -Dir C:\Aminos
          if (Get-ScheduledTask -TaskName Aminos* -ErrorAction SilentlyContinue) { throw "tasks remain" }
          if (Test-Path C:\Aminos\venv) { throw "venv remains" }
          if (Test-Path C:\Aminos\saas.env) { throw "secrets file remains" }
          if (-not (Test-Path C:\Aminos\data)) { throw "data was deleted" }
