[project]
name = "aminos"
version = "0.1.0"
description = "Legal translation workbench: terminology engine, structural checks and multi-pass translation (AR/FR/EN)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
docx = ["python-docx>=1.1"]
xlsx = ["openpyxl>=3.1"]
all = ["anthropic>=0.40", "python-docx>=1.1", "openpyxl>=3.1"]

[project.scripts]
aminos = "aminos.cli:main"

[tool.setuptools]
packages = ["aminos"]
