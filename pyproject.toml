[project]
name = "aminos"
version = "0.1.0"
description = "Legal translation workbench: terminology engine, structural checks and multi-pass translation (AR/FR/EN)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
docx = ["python-docx>=1.1"]
xlsx = ["openpyxl>=3.1"]
pdf = ["pdfplumber>=0.11"]
ocr = ["pytesseract>=0.3", "Pillow>=10"]
web = ["streamlit>=1.36"]
notary = ["cryptography>=42", "pyhanko>=0.25", "python-docx>=1.1"]
test = ["fpdf2>=2.7"]
swarm = ["agent-coordinator @ git+https://github.com/SuperInstance/agent-coordinator@4d2560d2e53d2d066328ed4a0250376efe44aa2a"]
all = ["anthropic>=0.40", "python-docx>=1.1", "openpyxl>=3.1", "pdfplumber>=0.11", "pytesseract>=0.3", "Pillow>=10", "streamlit>=1.36", "cryptography>=42", "pyhanko>=0.25"]

[project.scripts]
aminos = "aminos.cli:main"

[tool.setuptools.packages.find]
include = ["aminos*"]
